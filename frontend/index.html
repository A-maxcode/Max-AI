<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11131a" />
    <title>Max-AI</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Assistant home">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>Max-AI</span>
        </a>
        <span class="status"><span class="status-dot"></span> Ready to help</span>
      </header>

      <section class="conversation" aria-label="Conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-mark" aria-hidden="true">✳</div>
          <p class="eyebrow">A little help goes a long way</p>
          <h1>What’s on your mind?</h1>
          <p class="welcome-copy">Ask a question, explore an idea, or get something done.</p>
          <div class="suggestions" aria-label="Try asking">
            <button type="button" class="suggestion">Help me plan my week</button>
            <button type="button" class="suggestion">Explain a tricky idea simply</button>
            <button type="button" class="suggestion">Help me write something</button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <form class="composer" id="chat-form">
        <label class="sr-only" for="prompt">Message your assistant</label>
        <textarea
          id="prompt"
          name="prompt"
          rows="1"
          maxlength="4000"
          placeholder="Message your assistant..."
          required
        ></textarea>
        <div class="composer-footer">
          <span class="hint">Your conversations are sent securely to the configured AI provider.</span>
          <button class="send-button" id="send-button" type="submit" aria-label="Send message">
            <span aria-hidden="true">↑</span>
          </button>
        </div>
      </form>
      <p class="disclaimer">AI can make mistakes. Check important information.</p>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
